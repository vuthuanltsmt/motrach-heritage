<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Đăng nhập quản trị - Di sản Mộ Trạch
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #f6f1e6,
                    #eee7d9
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #222;
        }

        .login-card {
            width: 100%;
            max-width: 440px;

            background: #ffffff;

            border-radius: 20px;

            padding: 36px 32px;

            box-shadow:
                0 12px 40px
                rgba(0, 0, 0, 0.13);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;

            text-align: center;

            color: #800000;

            font-size: 29px;
            line-height: 1.3;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-top: 8px;
            margin-bottom: 30px;

            font-size: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 700;

            font-size: 16px;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            margin-bottom: 20px;

            border:
                1px solid #cfcfcf;

            border-radius: 11px;

            font-size: 16px;

            background: #ffffff;
        }

        input:focus {
            outline: none;

            border-color: #b99542;

            box-shadow:
                0 0 0 3px
                rgba(185, 149, 66, 0.16);
        }

        button {
            width: 100%;

            padding: 14px;

            border-radius: 11px;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        #loginButton {
            border: 0;

            background: #9d0000;

            color: #ffffff;
        }

        #loginButton:hover {
            background: #7d0000;
        }

        #forgotPasswordButton {
            margin-top: 12px;

            background: transparent;

            color: #800000;

            border:
                1px solid #800000;
        }

        #forgotPasswordButton:hover {
            background: #f7ecec;
        }

        button:disabled {
            opacity: 0.6;

            cursor: wait;
        }

        #message {
            min-height: 22px;

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;
        }

        .divider {
            height: 1px;

            background: #eeeeee;

            margin: 24px 0 20px;
        }

        .home-link {
            display: block;

            text-align: center;

            color: #800000;

            text-decoration: none;

            font-weight: 600;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 22px;

            padding: 11px;

            background: #faf7ef;

            border-radius: 9px;

            text-align: center;

            color: #777;

            font-size: 12px;

            line-height: 1.5;
        }

        @media(max-width: 520px) {

            .login-card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .subtitle {
                font-size: 16px;
            }

        }
    </style>
</head>


<body>

    <main class="login-card">

        <div class="logo">
            🏛️
        </div>

        <h1>
            Di sản Mộ Trạch
        </h1>

        <div class="subtitle">
            Đăng nhập quản trị
        </div>


        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Nhập email quản trị"
                autocomplete="username"
                required
            >


            <label for="password">
                Mật khẩu
            </label>

            <input
                id="password"
                type="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
            >


            <button
                id="loginButton"
                type="submit"
            >
                Đăng nhập
            </button>


            <button
                id="forgotPasswordButton"
                type="button"
            >
                Quên mật khẩu?
            </button>


            <div id="message"></div>

        </form>


        <div class="divider"></div>


        <a
            class="home-link"
            href="../index.html"
        >
            ← Về trang chủ
        </a>


        <div class="security-note">
            Khu vực dành cho quản trị viên
            Di sản Mộ Trạch.
        </div>

    </main>


    <script
        type="module"
        src="../js/admin-login.js"
    ></script>

</body>

</html>
