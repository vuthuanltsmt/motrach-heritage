<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Quản lý thư viện - Mộ Trạch Heritage
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f2ea;
            color: #222;
        }

        .admin-header {
            background: #800000;
            color: white;

            padding: 15px 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 21px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            color: white;
            text-decoration: none;

            border: 1px solid
                rgba(255,255,255,.6);

            border-radius: 8px;

            padding: 9px 13px;

            font-weight: 700;
        }

        .page {
            width: min(
                1200px,
                calc(100% - 30px)
            );

            margin: 28px auto 55px;
        }

        .page-title {
            margin-bottom: 22px;
        }

        .page-title h2 {
            margin: 0 0 7px;

            color: #800000;

            font-size: 30px;
        }

        .page-title p {
            margin: 0;
            color: #666;
        }

        .status-box {
            background: white;

            padding: 14px 17px;

            border-radius: 12px;

            margin-bottom: 18px;

            box-shadow:
                0 4px 16px
                rgba(0,0,0,.06);
        }

        #adminStatus {
            color: #666;
            font-size: 14px;
        }

        .tabs {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 20px;
        }

        .tab {
            border: 1px solid #ccc;

            background: white;

            color: #333;

            border-radius: 10px;

            padding: 13px;

            font-weight: 700;

            font-size: 15px;

            text-align: center;

            text-decoration: none;

            cursor: pointer;
        }

        .tab.active {
            background: #800000;
            color: white;
            border-color: #800000;
        }

        .toolbar {
            background: white;

            padding: 16px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 16px
                rgba(0,0,0,.06);
        }

        .toolbar-left {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 1;
        }

        #searchInput {
            width: 100%;
            max-width: 420px;

            border: 1px solid #ccc;

            border-radius: 9px;

            padding: 11px 13px;

            font-size: 15px;
        }

        #refreshButton {
            border: 0;

            border-radius: 8px;

            padding: 11px 14px;

            background: #eee8dc;

            font-weight: 700;

            cursor: pointer;
        }

        .count {
            color: #666;
            font-size: 14px;

            white-space: nowrap;
        }

        .media-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );

            gap: 18px;
        }

        .media-card {
            background: white;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,.07);

            display: flex;

            flex-direction: column;
        }

        .media-preview {
            width: 100%;

            aspect-ratio: 4 / 3;

            background: #eee8dc;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }

        .media-preview img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .media-preview audio {
            width: calc(100% - 25px);
        }

        .media-preview video {
            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #000;
        }

        .media-icon {
            font-size: 55px;
        }

        .media-info {
            padding: 15px;

            display: flex;

            flex-direction: column;

            flex: 1;
        }

        .media-name {
            font-weight: 700;

            line-height: 1.4;

            word-break: break-word;

            margin-bottom: 8px;
        }

        .media-path {
            color: #888;

            font-size: 12px;

            word-break: break-all;

            margin-bottom: 12px;
        }

        .media-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

            margin-top: auto;
        }

        .media-btn {
            border: 0;

            border-radius: 8px;

            padding: 9px 8px;

            cursor: pointer;

            font-weight: 700;

            text-decoration: none;

            text-align: center;

            font-size: 13px;
        }

        .btn-open {
            background: #28734a;
            color: white;
        }

        .btn-delete {
            background: #a00000;
            color: white;
        }

        .state-box {
            grid-column: 1 / -1;

            background: white;

            border-radius: 14px;

            padding: 45px 20px;

            text-align: center;

            color: #666;

            box-shadow:
                0 4px 16px
                rgba(0,0,0,.05);
        }

        .state-icon {
            font-size: 42px;

            margin-bottom: 12px;
        }

        #message {
            min-height: 25px;

            margin-top: 20px;

            text-align: center;

            font-weight: 700;
        }

        @media(max-width:950px) {

            .media-grid {
                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );
            }

        }

        @media(max-width:700px) {

            .page {
                width:
                    calc(100% - 20px);

                margin-top: 18px;
            }

            .admin-header {
                padding: 13px 12px;
            }

            .admin-header h1 {
                font-size: 17px;
            }

            .tabs {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-left {
                width: 100%;
            }

            #searchInput {
                max-width: none;
            }

            .count {
                text-align: right;
            }

            .media-grid {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );
            }

        }

        @media(max-width:480px) {

            .media-grid {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>


<body>


<header class="admin-header">

    <h1>
        🏛️ Mộ Trạch Heritage
    </h1>

    <div class="header-actions">

        <a
            class="header-btn"
            href="index.html"
        >
            ← Quản trị
        </a>

    </div>

</header>


<main class="page">


    <div class="page-title">

        <h2 id="pageTitle">
            📁 Quản lý thư viện
        </h2>

        <p id="pageDescription">
            Quản lý các tệp đã tải lên Mộ Trạch Heritage.
        </p>

    </div>


    <div class="status-box">

        <div id="adminStatus">
            Đang kiểm tra tài khoản quản trị...
        </div>

    </div>


    <nav class="tabs">

        <a
            id="imagesTab"
            class="tab"
            href="media.html?type=images"
        >
            🖼️ Ảnh
        </a>

        <a
            id="audioTab"
            class="tab"
            href="media.html?type=audio"
        >
            🎧 Audio
        </a>

        <a
            id="videoTab"
            class="tab"
            href="media.html?type=video"
        >
            🎬 Video
        </a>

    </nav>


    <div class="toolbar">
<div class="toolbar-left">

    <input
        id="searchInput"
        type="search"
        placeholder="Tìm theo tên file..."
    >

    <button
        id="refreshButton"
        type="button"
    >
        🔄 Làm mới
    </button>

    <button
        id="uploadButton"
        type="button"
        style="
            border:0;
            border-radius:8px;
            padding:11px 15px;
            background:#800000;
            color:white;
            font-weight:700;
            cursor:pointer;
            white-space:nowrap;
        "
    >
        ⬆️ Tải file lên
    </button>

    <input
        id="uploadInput"
        type="file"
        hidden
    >

</div>


        <div
            id="mediaCount"
            class="count"
        >
            0 tệp
        </div>

    </div>


    <section
        id="mediaGrid"
        class="media-grid"
    >

        <div class="state-box">

            <div class="state-icon">
                ⏳
            </div>

            Đang tải thư viện...

        </div>

    </section>


    <div id="message"></div>


</main>


<script
    type="module"
    src="../js/admin-media.js"
></script>


</body>

</html>
