<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Đặt lại mật khẩu - Di sản Mộ Trạch
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f1e8;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .reset-card {
            width: min(420px, calc(100% - 32px));
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            color: #800000;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            background: #800000;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.65;
        }

        #message {
            min-height: 22px;
            margin-top: 16px;
            text-align: center;
        }

        .login-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #800000;
            text-decoration: none;
        }
    </style>
</head>

<body>

<main class="reset-card">

    <h1>Di sản Mộ Trạch</h1>

    <div class="subtitle">
        Đặt mật khẩu quản trị mới
    </div>

    <form id="resetForm">

        <label for="password">
            Mật khẩu mới
        </label>

        <input
            id="password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <label for="confirmPassword">
            Nhập lại mật khẩu
        </label>

        <input
            id="confirmPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <button
            id="resetButton"
            type="submit"
        >
            Đặt mật khẩu mới
        </button>

        <div id="message"></div>

    </form>

    <a
        class="login-link"
        href="login.html"
    >
        ← Quay lại đăng nhập
    </a>

</main>

<script
    type="module"
    src="../js/reset-password.js"
></script>

</body>
</html>
