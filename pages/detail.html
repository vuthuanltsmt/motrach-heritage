<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mộ Trạch Heritage</title>

<link rel="stylesheet" href="../css/style.css">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
>

<style>

/* ==================================================
   NỀN TRANG
================================================== */

body{
    background:#f5f1e8;
}


/* ==================================================
   KHUNG CHÍNH
================================================== */

.detail{
    max-width:1200px;
    margin:auto;
    padding:25px 20px 70px;
}


/* ==================================================
   THANH ĐIỀU HƯỚNG
================================================== */

.top-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.top-btn{
    display:inline-block;
    padding:11px 20px;
    background:#8b0000;
    color:#fff;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    transition:.25s;
}

.top-btn:hover{
    background:#b00000;
    transform:translateY(-2px);
}


/* ==================================================
   ẢNH BÌA
================================================== */

.cover-box{
    position:relative;
    overflow:hidden;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.cover{
    display:block;
    width:100%;
    height:520px;
    object-fit:cover;
}


/* ==================================================
   NHÃN DI TÍCH
================================================== */

.cover-label{
    position:absolute;
    left:25px;
    bottom:25px;
    background:rgba(0,0,0,.65);
    color:white;
    padding:12px 20px;
    border-radius:30px;
    font-size:18px;
}


/* ==================================================
   TIÊU ĐỀ
================================================== */

.title{
    color:#8b0000;
    font-size:44px;
    line-height:1.25;
    margin:28px 0 22px;
}


/* ==================================================
   THÔNG TIN NHANH
================================================== */

.info-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.info-card{
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.info-card .label{
    color:#777;
    font-size:14px;
    margin-bottom:7px;
}

.info-card .value{
    color:#8b0000;
    font-size:18px;
    font-weight:bold;
}


/* ==================================================
   SECTION
================================================== */

.section{
    background:#fff;
    margin-top:30px;
    padding:30px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.section-title{
    color:#8b0000;
    font-size:29px;
    margin:0 0 20px;
    padding-bottom:12px;
    border-bottom:2px solid #eee;
}

.section-text{
    font-size:19px;
    line-height:1.9;
    text-align:justify;
}


/* ==================================================
   MEDIA
================================================== */

.media-box{
    background:#fff8ed;
    padding:22px;
    border-radius:15px;
}

#audio-player{
    width:100%;
    margin-top:10px;
}

.video-box{
    background:#111;
    padding:8px;
    border-radius:17px;
}

#video-player{
    display:block;
    width:100%;
    max-height:650px;
    background:#000;
    border-radius:12px;
}


/* ==================================================
   GALLERY
================================================== */

.gallery-viewer{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    background:#111;
    padding:15px;
    border-radius:17px;
}

.main-photo{
    width:100%;
    max-width:900px;
    height:520px;
    object-fit:contain;
    background:#000;
    border-radius:10px;
    cursor:pointer;
}

.nav-btn{
    width:50px;
    height:60px;
    border:0;
    border-radius:10px;
    background:#8b0000;
    color:#fff;
    font-size:27px;
    cursor:pointer;
}

.nav-btn:hover{
    background:#b00000;
}

.counter{
    text-align:center;
    color:#8b0000;
    font-weight:bold;
    margin:15px;
}

.thumbs{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
}

.thumbs img{
    width:105px;
    height:70px;
    object-fit:cover;
    border-radius:8px;
    cursor:pointer;
    border:3px solid transparent;
}

.thumbs img.active{
    border-color:#8b0000;
}


/* ==================================================
   BẢN ĐỒ
================================================== */

#map{
    width:100%;
    height:450px;
    border-radius:15px;
    overflow:hidden;
}


/* ==================================================
   ĐIỀU HƯỚNG DI TÍCH
================================================== */

.place-navigation{
    display:flex;
    justify-content:space-between;
    gap:20px;
    margin-top:35px;
}

.place-nav-btn{
    flex:1;
    padding:18px;
    border:0;
    border-radius:15px;
    background:#8b0000;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.place-nav-btn:hover{
    background:#b00000;
}


/* ==================================================
   LIGHTBOX
================================================== */

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    z-index:99999;
    background:rgba(0,0,0,.94);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:20px;
}

.lightbox img{
    max-width:92%;
    max-height:80vh;
    object-fit:contain;
    border-radius:10px;
}

.lightbox p{
    color:#fff;
    font-size:20px;
    margin-top:15px;
    text-align:center;
}

#close{
    position:absolute;
    top:15px;
    right:30px;
    color:white;
    font-size:50px;
    cursor:pointer;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:850px){

    .info-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .detail{
        padding:15px 10px 50px;
    }

    .top-nav{
        flex-direction:column;
        align-items:stretch;
    }

    .top-btn{
        text-align:center;
    }

    .cover{
        height:300px;
    }

    .cover-label{
        left:12px;
        bottom:12px;
        font-size:14px;
    }

    .title{
        font-size:30px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .section{
        padding:20px;
    }

    .section-title{
        font-size:23px;
    }

    .section-text{
        font-size:17px;
    }

    .main-photo{
        height:300px;
    }

    .gallery-viewer{
        gap:5px;
        padding:8px;
    }

    .nav-btn{
        width:40px;
        height:50px;
        font-size:20px;
    }

    .place-navigation{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<div class="detail">


<!-- ==================================================
     THANH ĐIỀU HƯỚNG
================================================== -->

<div class="top-nav">

    <a
        href="../index.html"
        class="top-btn">

        🏠 Trang chủ

    </a>

    <a
        href="heritage.html"
        class="top-btn">

        🏛️ Danh sách di tích

    </a>

</div>


<!-- ==================================================
     ẢNH BÌA
================================================== -->

<div class="cover-box">

    <img
        id="cover"
        class="cover"
        src=""
        alt="Ảnh di tích">

    <div
        id="cover-label"
        class="cover-label">

        Mộ Trạch Heritage

    </div>

</div>


<!-- TÊN -->

<h1
    id="name"
    class="title">
</h1>


<!-- ==================================================
     THÔNG TIN
================================================== -->

<div class="info-grid">


    <div class="info-card">

        <div class="label">
            Loại di tích
        </div>

        <div
            id="type"
            class="value">
        </div>

    </div>


    <div class="info-card">

        <div class="label">
            Niên đại
        </div>

        <div
            id="year"
            class="value">
        </div>

    </div>


    <div class="info-card">

        <div class="label">
            Xếp hạng
        </div>

        <div
            id="rank"
            class="value">
        </div>

    </div>


    <div class="info-card">

        <div class="label">
            Địa điểm
        </div>

        <div
            id="address"
            class="value">
        </div>

    </div>

</div>


<!-- ==================================================
     GIỚI THIỆU
================================================== -->

<div class="section">

    <h2 class="section-title">
        📖 Giới thiệu
    </h2>

    <p
        id="description"
        class="section-text">
    </p>

</div>


<!-- ==================================================
     LỊCH SỬ
================================================== -->

<div class="section">

    <h2 class="section-title">
        📜 Lịch sử
    </h2>

    <p
        id="history"
        class="section-text">
    </p>

</div>


<!-- ==================================================
     THUYẾT MINH
================================================== -->

<div class="section">

    <h2 class="section-title">
        🔊 Thuyết minh di tích
    </h2>

    <div class="media-box">

        <p>
            🎧 Nghe thuyết minh:
            <strong id="audio-name"></strong>
        </p>

        <audio
            id="audio-player"
            controls
            preload="metadata">

            Trình duyệt không hỗ trợ
            phát âm thanh.

        </audio>

    </div>

</div>


<!-- ==================================================
     VIDEO
================================================== -->

<div class="section">

    <h2 class="section-title">
        🎬 Video giới thiệu
    </h2>

    <div class="video-box">

        <video
            id="video-player"
            controls
            preload="metadata"
            playsinline>

            Trình duyệt không hỗ trợ
            phát video.

        </video>

    </div>

</div>


<!-- ==================================================
     THƯ VIỆN ẢNH
================================================== -->

<div class="section">

    <h2 class="section-title">
        📸 Thư viện ảnh
    </h2>


    <div class="gallery-viewer">


        <button
            id="prev"
            class="nav-btn">

            ❮

        </button>


        <img
            id="main-photo"
            class="main-photo"
            src=""
            alt="Ảnh di tích">


        <button
            id="next"
            class="nav-btn">

            ❯

        </button>


    </div>


    <div class="counter">

        Ảnh
        <span id="photo-index">1</span>
        /
        <span id="photo-total">1</span>

    </div>


    <div
        id="thumbs"
        class="thumbs">
    </div>

</div>


<!-- ==================================================
     BẢN ĐỒ
================================================== -->

<div class="section">

    <h2 class="section-title">
        📍 Vị trí di tích
    </h2>

    <div id="map"></div>

</div>


<!-- ==================================================
     ĐIỀU HƯỚNG
================================================== -->

<div class="place-navigation">

    <button
        id="previous-place"
        class="place-nav-btn">

        ⬅️ Di tích trước

    </button>


    <button
        id="next-place"
        class="place-nav-btn">

        Di tích tiếp theo ➡️

    </button>

</div>


</div>


<!-- ==================================================
     LIGHTBOX
================================================== -->

<div
    id="lightbox"
    class="lightbox">


    <span id="close">
        &times;
    </span>


    <img
        id="lightbox-img"
        src=""
        alt="Ảnh phóng to">


    <p id="caption"></p>


</div>


<script
src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>


<script
src="../js/detail.js">
</script>


</body>

</html>
