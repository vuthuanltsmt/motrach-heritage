<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bản đồ di sản Mộ Trạch</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f1e8;
    color:#333;
}


/* =========================
   HEADER
========================= */

header{
    background:#7b0000;
    color:white;
    padding:20px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:26px;
    font-weight:bold;
}

.home-btn{
    background:white;
    color:#7b0000;
    padding:10px 18px;
    border-radius:25px;
    text-decoration:none;
    font-weight:bold;
}


/* =========================
   CONTENT
========================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:25px 15px 50px;
}

.page-title{
    text-align:center;
    color:#7b0000;
    font-size:36px;
    margin:10px 0 25px;
}


/* =========================
   MAP
========================= */

.map-wrapper{
    background:white;
    padding:10px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

#map{
    width:100%;
    height:600px;
    border-radius:12px;
}


/* =========================
   INFO
========================= */

.map-note{
    margin-top:20px;
    background:#fff8ed;
    padding:18px;
    border-radius:12px;
    line-height:1.7;
}

.map-note strong{
    color:#7b0000;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header-inner{
        flex-direction:column;
    }

    .logo{
        font-size:21px;
        text-align:center;
    }

    .page-title{
        font-size:28px;
    }

    #map{
        height:500px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-inner">

        <div class="logo">
            🏛️ MỘ TRẠCH HERITAGE
        </div>

        <a
            href="../index.html"
            class="home-btn">

            🏠 Trang chủ

        </a>

    </div>

</header>


<!-- =========================
     CONTENT
========================= -->

<main class="container">

    <h1 class="page-title">
        🗺️ Bản đồ di sản Mộ Trạch
    </h1>


    <div class="map-wrapper">

        <div id="map"></div>

    </div>


    <div class="map-note">

        <strong>📍 Hướng dẫn:</strong>

        <br>

        Nhấn vào các biểu tượng trên bản đồ
        để xem thông tin từng di tích.

        <br>

        Nhấn vào tên di tích trong cửa sổ thông tin
        để mở trang chi tiết.

    </div>

</main>


<!-- =========================
     LEAFLET
========================= -->

<script
src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>


<script>

/* ==================================================
   KHỞI TẠO BẢN ĐỒ
================================================== */

const map = L.map("map");


/* ==================================================
   LỚP BẢN ĐỒ OPENSTREETMAP
================================================== */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/* ==================================================
   ĐỌC HERITAGE.JSON
================================================== */

fetch("../data/heritage.json")

.then(response => {

    if(!response.ok){

        throw new Error(
            "Không thể tải heritage.json"
        );

    }

    return response.json();

})


.then(data => {


    /* =========================
       KIỂM TRA DỮ LIỆU
    ========================= */

    if(
        !Array.isArray(data) ||
        data.length === 0
    ){

        throw new Error(
            "heritage.json không có dữ liệu"
        );

    }


    /* =========================
       TẠO BOUND
    ========================= */

    const bounds = [];


    /* =========================
       TẠO MARKER
    ========================= */

    data.forEach(place => {


        if(
            typeof place.lat !== "number" ||
            typeof place.lng !== "number"
        ){

            return;

        }


        const lat = place.lat;
        const lng = place.lng;


        bounds.push([
            lat,
            lng
        ]);


        /* =========================
           POPUP
        ========================= */

        const popup = `

            <div style="
                min-width:220px;
                font-family:Arial;
            ">

                <img
                    src="../${place.image}"
                    style="
                        width:100%;
                        height:130px;
                        object-fit:cover;
                        border-radius:8px;
                        margin-bottom:8px;
                    "
                    onerror="
                        this.style.display='none'
                    "
                >

                <h3 style="
                    color:#7b0000;
                    margin:5px 0 8px;
                ">

                    ${place.name}

                </h3>


                <p style="
                    margin:5px 0;
                ">

                    <strong>Loại:</strong>
                    ${place.type || ""}

                </p>


                <p style="
                    margin:5px 0;
                ">

                    ${place.description || ""}

                </p>


                <a
                    href="detail.html?id=${place.id}"
                    style="
                        display:inline-block;
                        margin-top:8px;
                        padding:8px 14px;
                        background:#7b0000;
                        color:white;
                        text-decoration:none;
                        border-radius:6px;
                        font-weight:bold;
                    ">

                    Xem chi tiết →

                </a>

            </div>

        `;


        /* =========================
           MARKER
        ========================= */

        L.marker([
            lat,
            lng
        ])

        .addTo(map)

        .bindPopup(popup);


    });


    /* =========================
       TỰ ĐỘNG CĂN BẢN ĐỒ
    ========================= */

    if(bounds.length > 0){

        map.fitBounds(
            bounds,
            {
                padding:[40,40]
            }
        );

    }

    else{

        map.setView(
            [20.9432,106.3653],
            16
        );

    }


})


.catch(error => {

    console.error(error);

    document.getElementById("map").innerHTML = `

        <div style="
            padding:40px;
            text-align:center;
            color:#8b0000;
        ">

            <h3>
                ❌ Không thể tải bản đồ
            </h3>

            <p>
                ${error.message}
            </p>

        </div>

    `;

});

</script>


</body>

</html>
