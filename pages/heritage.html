<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Danh sách di tích - Mộ Trạch Heritage</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
    background:#f5f5f5;
}

.page-container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:50px 0 80px;
}

.page-title{
    text-align:center;
    color:#8B0000;
    font-size:42px;
    margin-bottom:35px;
}

.search-box{
    display:block;
    width:650px;
    max-width:100%;
    margin:0 auto 45px;
    padding:16px 20px;
    font-size:20px;
    border:2px solid #8B0000;
    border-radius:12px;
    outline:none;
    background:white;
}

.heritage-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
}

.heritage-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    transition:.3s;
}

.heritage-card:hover{
    transform:translateY(-6px);
}

.heritage-image{
    width:100%;
    height:230px;
}

.heritage-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.heritage-content{
    padding:25px;
}

.heritage-content h3{
    color:#8B0000;
    font-size:26px;
    margin-bottom:10px;
}

.heritage-type{
    font-weight:bold;
    color:#777;
}

.heritage-address{
    margin:12px 0;
}

.media-icons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:15px 0;
}

.media-item{
    background:#f5e8e8;
    color:#8B0000;
    padding:7px 12px;
    border-radius:20px;
    font-size:14px;
    font-weight:bold;
}

.detail-btn{
    display:block;
    text-align:center;
    background:#8B0000;
    color:white;
    text-decoration:none;
    padding:13px;
    border-radius:30px;
    font-weight:bold;
}

.detail-btn:hover{
    background:#c40000;
}

.message{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:15px;
}

header a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>


<body>


<header>

<div class="container">

<div class="logo">

<h1>MỘ TRẠCH HERITAGE</h1>

<p>Di sản văn hóa - lịch sử làng Mộ Trạch</p>

</div>

<nav>

<a href="../index.html">
← Trang chủ
</a>

</nav>

</div>

</header>


<main class="page-container">

<h2 class="page-title">
Danh sách di tích
</h2>


<input
    id="search"
    class="search-box"
    type="text"
    placeholder="🔎 Tìm kiếm di tích..."
>


<div
    id="heritage-list"
    class="heritage-grid"
>

<div class="message">
Đang tải dữ liệu di tích...
</div>

</div>


</main>


<script src="../js/heritage.js"></script>

</body>

</html>
